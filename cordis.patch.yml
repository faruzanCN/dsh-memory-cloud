- insert:
    - id: dsh-memory-cloud
      name: 'dsh-memory-cloud'
      config:
        # All durable DSH memories live in the session logs under $DSH_HOME.
        sessionsDir: !!js dshHomePath('sessions')
        # Upper bounds keep the nebula responsive on profiles with long histories.
        maxSessions: 400
        maxFragments: 28
        maxFragmentChars: 220
        # All /memory-cloud routes require DSH owner authentication.
        # Host/Origin trust is managed by DSH's connection service, not this plugin.
